<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Clause Similarity Engine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="container">

        <h1>Legal Clause Similarity Engine</h1>

        <p class="subtitle">Find semantically similar legal clauses using Word2Vec.</p>

        <textarea id="query" placeholder="Enter a legal clause..."></textarea>

        <div class="controls">
            <select id="topK">
                <option value="5">Top 5</option>
                <option value="10">Top 10</option>
                <option value="20">Top 20</option>
            </select>

            <button id="searchBtn">Find Similar Clauses</button>
        </div>

        <div id="status"></div>

        <div id="results"></div>

    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
